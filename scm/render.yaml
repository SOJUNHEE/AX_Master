services:
  - type: web
    name: flow-scm
    runtime: python
    rootDir: scm
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python -m pip check && python -m gunicorn --check-config app:app
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
